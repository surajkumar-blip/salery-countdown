<!DOCTYPE html>
<html>
<head>
    <title>Suraj CRM - Salary Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <div class="company">FURLENCO FURNITURE</div>

    <h1>SURAJ ji</h1>
    <p class="subtitle">Salary Countdown 💰</p>

    <div class="countdown">

        <div class="box">
            <span id="days">00</span>
            <small>DAYS</small>
        </div>

        <div class="box">
            <span id="hours">00</span>
            <small>HOURS</small>
        </div>

        <div class="box">
            <span id="minutes">00</span>
            <small>MINUTES</small>
        </div>

        <div class="box">
            <span id="seconds">00</span>
            <small>SECONDS</small>
        </div>

    </div>

    <p id="salaryDate"></p>

    <div class="progress-container">
        <div id="progressBar"></div>
    </div>

    <p id="progressText"></p>

</div>

<script src="script.js"></script>

</body>
</html>
